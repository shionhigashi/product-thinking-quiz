<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Thinking Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
  :root{
    --paper:#ECECF1;
    --surface:#FFFFFF;
    --surface-2:#E5E5EC;
    --ink:#171720;
    --ink-2:#4C4C5A;
    --ink-3:#77778A;
    --rule:#D4D4DF;
    --rule-soft:#E6E6EE;
    --accent:#2F3AA3;
    --accent-2:#5A64D8;
    --accent-soft:rgba(47,58,163,.10);
    --on-accent:#FBFBFD;
    --add:#2C6E49;
    --add-bg:rgba(44,110,73,.10);
    --add-rule:rgba(44,110,73,.45);
    --del:#98421F;
    --del-bg:rgba(152,66,31,.09);
    --del-rule:rgba(152,66,31,.4);
    --on-fill:#FBFBFD;
    --chip-fill:rgba(255,255,255,.20);
    --dot:rgba(47,58,163,.11);
    --lift:0 1px 2px rgba(23,23,32,.06), 0 14px 34px -24px rgba(23,23,32,.5);
    --lift-2:0 2px 4px rgba(23,23,32,.07), 0 26px 50px -30px rgba(23,23,32,.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101015;
      --surface:#1B1B24;
      --surface-2:#24242F;
      --ink:#ECECF3;
      --ink-2:#B2B2C2;
      --ink-3:#83839A;
      --rule:#32323F;
      --rule-soft:#282833;
      --accent:#9CA2F6;
      --accent-2:#C0C4FF;
      --accent-soft:rgba(156,162,246,.15);
      --on-accent:#101015;
      --add:#7CC79C;
      --add-bg:rgba(124,199,156,.12);
      --add-rule:rgba(124,199,156,.4);
      --del:#E7A183;
      --del-bg:rgba(231,161,131,.11);
      --del-rule:rgba(231,161,131,.36);
      --on-fill:#101015;
      --chip-fill:rgba(0,0,0,.16);
      --dot:rgba(156,162,246,.10);
      --lift:0 1px 2px rgba(0,0,0,.5), 0 16px 36px -26px rgba(0,0,0,.9);
      --lift-2:0 2px 6px rgba(0,0,0,.55), 0 30px 56px -32px #000;
    }
  }
  :root[data-theme="dark"]{
    --paper:#101015;
    --surface:#1B1B24;
    --surface-2:#24242F;
    --ink:#ECECF3;
    --ink-2:#B2B2C2;
    --ink-3:#83839A;
    --rule:#32323F;
    --rule-soft:#282833;
    --accent:#9CA2F6;
    --accent-2:#C0C4FF;
    --accent-soft:rgba(156,162,246,.15);
    --on-accent:#101015;
    --add:#7CC79C;
    --add-bg:rgba(124,199,156,.12);
    --add-rule:rgba(124,199,156,.4);
    --del:#E7A183;
    --del-bg:rgba(231,161,131,.11);
    --del-rule:rgba(231,161,131,.36);
    --on-fill:#101015;
    --chip-fill:rgba(0,0,0,.16);
    --dot:rgba(156,162,246,.10);
    --lift:0 1px 2px rgba(0,0,0,.5), 0 16px 36px -26px rgba(0,0,0,.9);
    --lift-2:0 2px 6px rgba(0,0,0,.55), 0 30px 56px -32px #000;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size:24px 24px;
    background-position:-12px -12px;
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:16.5px;
    line-height:1.58;
    padding-inline:20px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.stem,.scorenum{font-family:Newsreader, Georgia, "Times New Roman", serif;font-weight:500;text-wrap:balance;margin:0;}
  p{margin:0;}

  /* ---------- masthead ---------- */
  header.top{
    max-width:43rem;margin-inline:auto;width:100%;
    display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;
    padding-block:1.5rem 1.1rem;
  }
  .brand{
    font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    background:var(--accent);color:var(--on-accent);padding:.4rem .7rem;border-radius:4px;
  }
  .count{
    font-family:"IBM Plex Mono",monospace;font-size:.73rem;letter-spacing:.08em;color:var(--ink-3);
    font-variant-numeric:tabular-nums;text-transform:uppercase;
  }

  .wrap{max-width:43rem;margin-inline:auto;width:100%;padding-bottom:3rem;display:flex;flex-direction:column;gap:1.1rem;}

  /* ---------- progress ---------- */
  .progress{display:flex;gap:5px;}
  .progress span{
    flex:1;height:6px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden;
  }
  .progress span::after{
    content:"";position:absolute;inset:0;border-radius:3px;transform:scaleX(0);transform-origin:left;
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
  }
  .progress span.ok::after{background:var(--add);transform:scaleX(1);}
  .progress span.no::after{background:var(--del);transform:scaleX(1);}
  .progress span.now{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);}

  /* ---------- card ---------- */
  .card{
    position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--rule);border-radius:12px;
    padding:1.7rem 1.6rem 1.6rem;box-shadow:var(--lift-2);
    animation:cardin .3s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardin{from{opacity:0;transform:translateY(10px);}}
  .card > *{position:relative;z-index:1;}
  .card > .ghost{z-index:0;}
  .ghost{
    position:absolute;top:-2.2rem;right:.6rem;pointer-events:none;user-select:none;
    font-family:Newsreader,Georgia,serif;font-weight:600;font-size:9.5rem;line-height:1;
    color:var(--accent);opacity:.08;font-variant-numeric:tabular-nums;letter-spacing:-.04em;
  }
  .tag{
    display:inline-block;align-self:flex-start;
    font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
    background:var(--accent);color:var(--on-accent);padding:.34rem .62rem;border-radius:4px;
  }
  .stem{font-size:clamp(1.45rem,4.3vw,1.95rem);line-height:1.2;margin-block:1rem 1.3rem;letter-spacing:-.01em;}
  .stem .quote{
    display:block;font-size:.82em;color:var(--ink-2);
    border-left:3px solid var(--accent);padding-left:.85rem;margin-top:.75rem;
  }
  .ask{display:block;margin-top:.55rem;}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:.6rem;}
  .opt{
    font:inherit;text-align:left;cursor:pointer;position:relative;
    display:grid;grid-template-columns:1.75rem 1fr;gap:.85rem;align-items:center;
    background:var(--surface);color:var(--ink);
    border:1.5px solid var(--rule);border-radius:8px;
    padding:.9rem 1rem;
    transition:transform .15s cubic-bezier(.2,.8,.3,1), border-color .15s ease, box-shadow .15s ease, background-color .2s ease, color .2s ease;
  }
  .opt .key{
    display:grid;place-items:center;width:1.75rem;height:1.75rem;flex:none;
    border:1px solid var(--rule);border-radius:5px;
    font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-3);
    transition:inherit;
  }
  .opt:hover:not([data-locked]){border-color:var(--accent);transform:translateX(5px);box-shadow:-4px 0 0 0 var(--accent);}
  .opt:hover:not([data-locked]) .key{border-color:var(--accent);color:var(--accent);}
  .opt[data-locked]{cursor:default;}
  .opt[data-locked]:not(.right):not(.wrong){opacity:.42;}
  .opt.right{background:var(--add);border-color:var(--add);color:var(--on-fill);box-shadow:var(--lift);}
  .opt.wrong{background:var(--del);border-color:var(--del);color:var(--on-fill);box-shadow:var(--lift);}
  .opt.right .key,.opt.wrong .key{background:var(--chip-fill);border-color:transparent;color:inherit;font-size:.95rem;}

  .hint{
    font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.06em;color:var(--ink-3);
    margin-top:.9rem;
  }
  .hint kbd{
    font:inherit;background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;
    padding:.05rem .3rem;color:var(--ink-2);
  }

  /* ---------- explanation ---------- */
  .why{display:flex;flex-direction:column;gap:.8rem;margin-top:1.35rem;padding-top:1.35rem;border-top:1px solid var(--rule-soft);}
  .why:empty{display:none;}
  .why{animation:rise .34s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}}
  .verdict{
    align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:500;
    letter-spacing:.15em;text-transform:uppercase;padding:.3rem .6rem;border-radius:4px;color:var(--on-fill);
  }
  .verdict.ok{background:var(--add);}
  .verdict.no{background:var(--del);}
  .why p.text{color:var(--ink-2);font-size:.97rem;}
  .why p.text b{color:var(--ink);font-weight:600;}
  .diff{border:1px solid var(--rule);border-radius:8px;overflow:hidden;}
  .diff div{
    font-family:"IBM Plex Mono",monospace;font-size:.83rem;line-height:1.5;padding:.65rem .9rem;
    display:grid;grid-template-columns:1.1rem 1fr;gap:.4rem;
  }
  .diff .m{background:var(--del-bg);color:var(--del);box-shadow:inset 3px 0 0 var(--del-rule);}
  .diff .p{background:var(--add-bg);color:var(--add);box-shadow:inset 3px 0 0 var(--add-rule);border-top:1px solid var(--rule-soft);}

  /* ---------- buttons ---------- */
  .btn{
    font:inherit;font-weight:500;cursor:pointer;align-self:flex-start;
    background:var(--accent);color:var(--on-accent);border:1.5px solid var(--accent);
    border-radius:8px;padding:.68rem 1.25rem;
    transition:transform .15s cubic-bezier(.2,.8,.3,1), box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:var(--lift);filter:brightness(1.06);}
  .btn.ghost{background:transparent;color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}

  /* ---------- results ---------- */
  .scorewrap{position:relative;width:150px;height:150px;margin-block:.4rem 1rem;}
  .ring{display:block;width:150px;height:150px;}
  .ring .track{stroke:var(--rule);}
  .ring .arc{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1);}
  .scorenum{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .scorenum small{font-size:.38em;color:var(--ink-3);}
  .review{display:flex;flex-direction:column;margin-block:1.2rem;border-top:1px solid var(--rule-soft);}
  .review > div{padding:.8rem 0;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:.15rem;}
  .review .rq{font-size:.95rem;display:grid;grid-template-columns:1.5rem 1fr;gap:.6rem;align-items:center;font-weight:500;}
  .review .m{
    display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:5px;
    font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--on-fill);
  }
  .review .ok .m{background:var(--add);}
  .review .no .m{background:var(--del);}
  .review .yours{font-size:.82rem;color:var(--del);padding-left:2.1rem;font-family:"IBM Plex Mono",monospace;}
  .review .take{font-size:.89rem;color:var(--ink-2);padding-left:2.1rem;}

  footer{
    max-width:43rem;margin-inline:auto;width:100%;border-top:1px solid var(--rule);
    padding-block:1.1rem 2.5rem;font-size:.79rem;color:var(--ink-3);
  }
  footer a{color:var(--accent);}

  @media (max-width:560px){
    .card{padding:1.4rem 1.15rem;border-radius:10px;}
    .ghost{font-size:7rem;top:-1.6rem;}
    .opt{grid-template-columns:1.6rem 1fr;gap:.65rem;padding:.85rem .85rem;}
    .opt .key{width:1.6rem;height:1.6rem;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>

<header class="top">
  <span class="brand">Product Thinking Quiz</span>
  <span class="count" id="count">Question 1 of 8</span>
</header>

<div class="wrap">
  <div class="progress" id="prog" aria-hidden="true"></div>
  <main id="stage"></main>
</div>

<footer>
  Eight questions on the frameworks from the product thinking guide &mdash; the three shifts, 5 Whys, the 4Cs, metrics, de-risking and staged delivery. Frameworks adapted from <a href="https://www.idg.gov.sg/product-thinking/">Singapore&rsquo;s IDG pathway</a>.
</footer>

<script>
(function(){
  "use strict";

  var QUESTIONS = [
    {
      tag: "Problems before solutions",
      stem: "A stakeholder files a ticket: <span class=\"quote\">&ldquo;Add a CSV export button to the reports page.&rdquo;</span>",
      ask: "What&rsquo;s the most useful first move?",
      options: [
        { t: "Estimate it and pull it into the sprint" },
        { t: "Ask what people do with the numbers after they export them", ok: true },
        { t: "Build a configurable export with column selection, so it covers future asks" },
        { t: "Push back — it isn&rsquo;t on the roadmap this quarter" }
      ],
      why: "A request is <b>data about a problem, not a specification</b>. One question surfaces the real job — and the answer is usually smaller than the ticket.",
      diff: { m: "Add a CSV export button", p: "Four ops leads retype these numbers into a Monday slide" },
      also: "Configurability is gold-plating bought before you know the second case. Refusing is obstruction — you still don&rsquo;t know what the work is for.",
      take: "The request is evidence of a problem. Go find the problem."
    },
    {
      tag: "Outputs vs outcomes",
      stem: "Four things a team reported at the end of a quarter.",
      ask: "Which one is an <em>outcome</em>?",
      options: [
        { t: "The importer now supports five delimiters" },
        { t: "First-attempt import success rose from 61% to 90%", ok: true },
        { t: "The docs page was published" },
        { t: "Twelve story points closed" }
      ],
      why: "An output is what you delivered. An outcome is <b>what became different because you delivered it</b>. Every other line here can be true while nothing changed for anyone.",
      diff: { m: "Shipped: importer supports five delimiters", p: "Changed: first-attempt import success 61% → 90%" },
      take: "Outputs can all be green while the outcome never moves."
    },
    {
      tag: "Five Whys",
      stem: "You&rsquo;re running a Five Whys on a spike in failed imports. Your fourth &ldquo;why&rdquo; lands on: <span class=\"quote\">&ldquo;The user uploaded a file in the wrong format.&rdquo;</span>",
      ask: "What now?",
      options: [
        { t: "Stop — that&rsquo;s the root cause" },
        { t: "Stop — the real cause is Excel&rsquo;s locale defaults, which are outside our control" },
        { t: "Ask why again: why was that so easy to do, and why did the product fail that way?", ok: true },
        { t: "Stop at exactly five whys, whatever the fifth one says" }
      ],
      why: "Landing on a person being careless means the analysis stopped early. <b>Keep going until you reach a cause you could change this sprint</b> — here, that the parser accepts one delimiter and the error explains nothing.",
      also: "&ldquo;Outside our control&rdquo; is where the useful part starts, not where it ends. And five isn&rsquo;t a magic number — it&rsquo;s a reminder not to stop at the first plausible answer.",
      take: "If the last why blames a user, go one more."
    },
    {
      tag: "The 4Cs",
      stem: "A problem statement reads: <span class=\"quote\">&ldquo;New customers on European Excel locales can&rsquo;t complete their first import — 39% of first imports fail. We accept only comma delimiters and surface the raw parser error.&rdquo;</span>",
      ask: "Which of the 4Cs is missing?",
      options: [
        { t: "Clarity — what the problem is, in plain words" },
        { t: "Consequence — what it costs, and to whom" },
        { t: "Cause — why it exists" },
        { t: "Confirmation — how we know it&rsquo;s real", ok: true }
      ],
      why: "Clarity, Consequence (39%) and Cause (one delimiter, raw error) are all there. What&rsquo;s missing is the <b>evidence</b>: 22 of last quarter&rsquo;s 60 tickets attach a semicolon file, and replays show nine users retrying the same file three times, then leaving.",
      also: "Confirmation is the C engineers skip, and it&rsquo;s the one that separates a problem from a hunch.",
      take: "A problem without evidence is a hunch with a paragraph around it."
    },
    {
      tag: "Leading &amp; lagging",
      stem: "You ship the import fix on Monday.",
      ask: "Which of these is a <em>leading</em> indicator?",
      options: [
        { t: "Quarterly support ticket volume" },
        { t: "Share of uploads where the delimiter was auto-detected", ok: true },
        { t: "Day-7 activation rate" },
        { t: "Trial-to-paid conversion" }
      ],
      why: "Leading indicators are the early links in the same causal chain — visible in days, and <b>still early enough to act on</b>. The other three are lagging: they&rsquo;re the ones that count, and they arrive far too late to steer by.",
      diff: { m: "lagging — quarterly support volume: true, and three months late", p: "leading — delimiter auto-detected on 71% of uploads: visible Tuesday" },
      also: "Ship the leading one in the same PR as the feature. Instrumentation that lands a sprint later never lands.",
      take: "Watch the leading ones; report the lagging ones."
    },
    {
      tag: "SMART targets",
      stem: "Four ways of stating the same goal.",
      ask: "Which one would let two people agree, with no discussion, on whether it happened?",
      options: [
        { t: "Reduce import failures" },
        { t: "Raise first-attempt import success from 61% to 85% for new accounts by the end of Q3", ok: true },
        { t: "Make imports significantly more reliable this year" },
        { t: "Get import success as high as we reasonably can" }
      ],
      why: "Specific, measurable, achievable, relevant, time-bound — but the practical test is simpler: <b>could two people disagree about whether you hit it?</b> If yes, it isn&rsquo;t a target yet.",
      diff: { m: "Reduce import failures", p: "61% → 85% for new accounts, by end of Q3" },
      also: "A goal you can&rsquo;t settle objectively gets settled by whoever argues most confidently in the room.",
      take: "If two people could disagree about whether you hit it, it isn&rsquo;t a target."
    },
    {
      tag: "Riskiest assumption",
      stem: "Someone proposes a weekly scheduled report email. It sounds plausible, but nobody knows whether teams would actually use it.",
      ask: "What do you build first?",
      options: [
        { t: "A production scheduler with a job queue and retries" },
        { t: "A design doc and an RFC, so the team can agree on the architecture" },
        { t: "Send it by hand every Monday to five teams, from a spreadsheet", ok: true },
        { t: "A feature flag and an A/B testing framework" }
      ],
      why: "The riskiest assumption is that anyone wants it — that&rsquo;s market risk, and it&rsquo;s the cheapest to test: <b>real users, fake product</b>. Doing it manually for five teams answers in a week what the scheduler would answer in a quarter.",
      also: "A Singapore government team validated health appointment booking with a form wired to a spreadsheet before building anything: zero bookings in the control arm, 24 in the treatment. Then they built it.",
      take: "Find the riskiest assumption, then buy the cheapest answer to it."
    },
    {
      tag: "Staged delivery",
      stem: "Your prototype answered the question it was built for: yes, this can be built. Nobody has confirmed yet that anyone wants it.",
      ask: "Which of these would be the mistake?",
      options: [
        { t: "Throwing the prototype away and writing the real thing later" },
        { t: "Hardcoding the one customer&rsquo;s account ID for now" },
        { t: "Generalising it into a plugin system so future integrations drop straight in", ok: true },
        { t: "Putting it in front of five real users while it&rsquo;s still unpolished" }
      ],
      why: "That&rsquo;s stage-three work done at stage one. Proof of concept asks <em>does it work</em>; proof of value asks <em>does it help anyone</em>. <b>The abstraction is built before there&rsquo;s evidence about which abstraction you need</b> — and once shipped, it bills you every month forever.",
      diff: { m: "A plugin system for the integrations we&rsquo;ll surely have", p: "Hardcode it until the second real case arrives" },
      also: "It doesn&rsquo;t feel like risk. It feels like being thorough. That&rsquo;s what makes it the common one.",
      take: "Build for the stage you&rsquo;re in, not the one you hope for."
    }
  ];

  var stage = document.getElementById("stage");
  var prog = document.getElementById("prog");
  var count = document.getElementById("count");
  var state = { i: 0, answers: [], locked: false, order: [] };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function shuffle(n){
    var a = [], i, j, t;
    for (i = 0; i < n; i++) a.push(i);
    for (i = a.length - 1; i > 0; i--){
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  function buildProgress(){
    prog.innerHTML = "";
    for (var i = 0; i < QUESTIONS.length; i++) prog.appendChild(document.createElement("span"));
  }

  function paintProgress(){
    var ticks = prog.children, i;
    for (i = 0; i < ticks.length; i++){
      ticks[i].className = "";
      if (state.answers[i]) ticks[i].className = state.answers[i].correct ? "ok" : "no";
      else if (i === state.i && !isDone()) ticks[i].className = "now";
    }
  }

  function isDone(){ return state.answers.filter(Boolean).length === QUESTIONS.length; }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function renderQuestion(){
    var q = QUESTIONS[state.i];
    state.locked = false;
    state.order = shuffle(q.options.length);
    count.textContent = "Question " + (state.i + 1) + " of " + QUESTIONS.length;
    stage.innerHTML = "";

    var card = el("section", "card");
    card.appendChild(el("div", "ghost", pad(state.i + 1)));
    card.appendChild(el("p", "tag", q.tag));
    card.appendChild(el("h1", "stem", q.stem + "<span class=\"ask\">" + q.ask + "</span>"));

    var opts = el("div", "opts");
    opts.setAttribute("role", "group");
    opts.setAttribute("aria-label", "Answer options");
    state.order.forEach(function(oi, pos){
      var o = q.options[oi];
      var b = el("button", "opt");
      b.type = "button";
      b.appendChild(el("span", "key", String(pos + 1)));
      b.appendChild(el("span", "txt", o.t));
      b.addEventListener("click", function(){ answer(pos); });
      opts.appendChild(b);
    });
    card.appendChild(opts);
    card.appendChild(el("p", "hint", "Press <kbd>1</kbd>&ndash;<kbd>4</kbd> to answer"));

    var why = el("div", "why");
    why.id = "why";
    why.setAttribute("role", "status");
    why.setAttribute("aria-live", "polite");
    card.appendChild(why);

    stage.appendChild(card);
    paintProgress();
  }

  function answer(pos){
    if (state.locked) return;
    state.locked = true;

    var q = QUESTIONS[state.i];
    var chosen = q.options[state.order[pos]];
    var correct = !!chosen.ok;
    state.answers[state.i] = { correct: correct, chosen: chosen.t };

    var buttons = stage.querySelectorAll(".opt");
    Array.prototype.forEach.call(buttons, function(b, p){
      var o = q.options[state.order[p]];
      b.setAttribute("data-locked", "true");
      b.setAttribute("aria-disabled", "true");
      if (o.ok){ b.classList.add("right"); b.querySelector(".key").textContent = "✓"; }
      else if (p === pos){ b.classList.add("wrong"); b.querySelector(".key").textContent = "✕"; }
    });

    var hint = stage.querySelector(".hint");
    if (hint) hint.innerHTML = "Press <kbd>Enter</kbd> to continue";

    var why = document.getElementById("why");
    why.appendChild(el("p", "verdict " + (correct ? "ok" : "no"),
      correct ? "Correct" : "Not quite"));
    if (!correct) why.appendChild(el("p", "text", "The right answer is marked in green above."));
    why.appendChild(el("p", "text", q.why));
    if (q.diff){
      var d = el("div", "diff");
      d.appendChild(el("div", "m", "<span>&minus;</span><span>" + q.diff.m + "</span>"));
      d.appendChild(el("div", "p", "<span>+</span><span>" + q.diff.p + "</span>"));
      why.appendChild(d);
    }
    if (q.also) why.appendChild(el("p", "text", q.also));

    var next = el("button", "btn", state.i === QUESTIONS.length - 1 ? "See your score →" : "Next question →");
    next.type = "button";
    next.addEventListener("click", advance);
    why.appendChild(next);
    next.focus();

    paintProgress();
  }

  function advance(){
    if (!state.locked) return;
    if (state.i === QUESTIONS.length - 1) renderResults();
    else { state.i++; renderQuestion(); window.scrollTo(0, 0); }
  }

  function verdictLine(score){
    if (score === 8) return "Nothing left to teach you here. Go ask someone what their Monday looks like.";
    if (score >= 6) return "Solid. You&rsquo;d catch most bad tickets before the estimate &mdash; which is where catching them is cheap.";
    if (score >= 4) return "The instincts are there; the frameworks aren&rsquo;t automatic yet. The misses below name which ones to reread.";
    return "Worth a second pass through the guide. Each miss below points at the section that covers it.";
  }

  function renderResults(){
    var score = state.answers.filter(function(a){ return a && a.correct; }).length;
    var total = QUESTIONS.length;
    count.textContent = "Complete";
    stage.innerHTML = "";

    var card = el("section", "card");
    card.appendChild(el("p", "tag", "Your score"));

    var color = score >= 6 ? "var(--add)" : (score >= 4 ? "var(--accent)" : "var(--del)");
    var C = 2 * Math.PI * 62;
    var wrap = el("div", "scorewrap");
    wrap.innerHTML =
      '<svg class="ring" viewBox="0 0 150 150" aria-hidden="true">' +
        '<circle class="track" cx="75" cy="75" r="62" fill="none" stroke-width="11"></circle>' +
        '<circle class="arc" cx="75" cy="75" r="62" fill="none" stroke="' + color + '" stroke-width="11" ' +
          'stroke-linecap="round" transform="rotate(-90 75 75)" ' +
          'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="scorenum" id="num">0<small>/' + total + '</small></div>';
    card.appendChild(wrap);
    card.appendChild(el("h2", "stem", verdictLine(score)));

    var review = el("div", "review");
    QUESTIONS.forEach(function(q, i){
      var a = state.answers[i] || { correct: false, chosen: "—" };
      var row = el("div", a.correct ? "ok" : "no");
      row.appendChild(el("p", "rq",
        "<span class=\"m\">" + (a.correct ? "✓" : "✕") + "</span><span>" + q.tag + "</span>"));
      if (!a.correct) row.appendChild(el("p", "yours", "you chose: " + a.chosen));
      row.appendChild(el("p", "take", q.take));
      review.appendChild(row);
    });
    card.appendChild(review);

    var again = el("button", "btn ghost", "Try again ↺");
    again.type = "button";
    again.addEventListener("click", function(){
      state = { i: 0, answers: [], locked: false, order: [] };
      renderQuestion();
      window.scrollTo(0, 0);
    });
    card.appendChild(again);

    stage.appendChild(card);
    paintProgress();
    window.scrollTo(0, 0);

    var arc = card.querySelector(".arc");
    var num = card.querySelector("#num");
    if (reduce){
      arc.setAttribute("stroke-dashoffset", String(C * (1 - score / total)));
      num.innerHTML = score + "<small>/" + total + "</small>";
    } else {
      requestAnimationFrame(function(){
        arc.setAttribute("stroke-dashoffset", String(C * (1 - score / total)));
      });
      var shown = 0;
      var tick = setInterval(function(){
        shown++;
        num.innerHTML = shown + "<small>/" + total + "</small>";
        if (shown >= score) clearInterval(tick);
      }, score ? Math.min(120, 900 / score) : 0);
      if (!score) num.innerHTML = "0<small>/" + total + "</small>";
    }
  }

  document.addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!state.locked && /^[1-4]$/.test(e.key)){
      var buttons = stage.querySelectorAll(".opt");
      var idx = parseInt(e.key, 10) - 1;
      if (buttons[idx]){ e.preventDefault(); answer(idx); }
      return;
    }
    if (state.locked && e.key === "ArrowRight"){ e.preventDefault(); advance(); }
  });

  buildProgress();
  renderQuestion();
})();
</script>
</body>
</html>
